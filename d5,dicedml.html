<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Bắn Súng Diệt Zombie 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            margin-top: -6px;
            margin-left: -6px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.7);
            border: 2px solid rgba(255, 0, 0, 0.8);
            pointer-events: none;
            z-index: 10;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
            z-index: 10;
        }
        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
            cursor: pointer;
        }
        #instructions h1 { margin-bottom: 10px; font-size: 45px; color: #2ecc71; text-shadow: 0 0 10px #2ecc71; }
        #instructions p { font-size: 18px; margin: 5px; color: #ccc; }
        .danger { color: #e74c3c; font-weight: bold; }
    </style>
    <!-- Thư viện Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="crosshair"></div>
<div id="ui">
    Zombie đã diệt: <span id="score">0</span> | 
    Máu: <span id="hp" class="danger">100</span>
</div>

<div id="instructions">
    <h1>ZOMBIE SURVIVAL 3D</h1>
    <p>Click vào màn hình để BẮT ĐẦU</p>
    <p style="margin-top: 20px; color: #f1c40f;">Di chuyển: <b>W, A, S, D</b></p>
    <p style="color: #f1c40f;">Ngắm & Bắn: <b>Chuột & Click Trái</b></p>
</div>

<script>
let scene, camera, renderer;
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let prevTime = performance.now();
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();

let score = 0;
let playerHp = 100;
let zombies = [];
let bullets = [];
let gun;

const instructions = document.getElementById('instructions');
const scoreEl = document.getElementById('score');
const hpEl = document.getElementById('hp');

function init() {
    // 1. Scene & Camera
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05050a);
    scene.fog = new THREE.FogExp2(0x05050a, 0.025); // Sương mù đêm

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.y = 1.6;

    // 2. Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // 3. Ánh sáng âm u Đêm Zombie
    const ambientLight = new THREE.AmbientLight(0x223344, 0.6);
    scene.add(ambientLight);

    // Đèn pin / Đèn hướng
    const dirLight = new THREE.DirectionalLight(0x99bbff, 0.5);
    dirLight.position.set(10, 30, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 4. Sàn nhà
    const floorGeo = new THREE.PlaneGeometry(120, 120);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.9 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(120, 60, 0x2ecc71, 0x222233);
    grid.position.y = 0.01;
    scene.add(grid);

    // 5. Tạo Súng
    createGun();

    // 6. Tạo đợt Zombie đầu tiên
    for (let i = 0; i < 6; i++) {
        spawnZombie();
    }

    setupControls();
    window.addEventListener('resize', onWindowResize);
}

// Tạo súng lục 3D
function createGun() {
    const gunGroup = new THREE.Group();

    const bodyGeo = new THREE.BoxGeometry(0.1, 0.15, 0.4);
    const gunMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8 });
    const body = new THREE.Mesh(bodyGeo, gunMat);
    gunGroup.add(body);

    const barrelGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.35);
    const barrelMat = new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 0.9 });
    const barrel = new THREE.Mesh(barrelGeo, barrelMat);
    barrel.rotation.x = Math.PI / 2;
    barrel.position.set(0, 0.04, -0.25);
    gunGroup.add(barrel);

    gunGroup.position.set(0.2, -0.2, -0.4);
    camera.add(gunGroup);
    scene.add(camera);
    gun = gunGroup;
}

// Tạo mô hình Zombie 3D (Đầu, Thân, Tay chân)
function createZombieMesh() {
    const zombieGroup = new THREE.Group();

    const skinMat = new THREE.MeshStandardMaterial({ color: 0x27ae60, roughness: 0.6 }); // Da xanh zombie
    const clothesMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 }); // Áo rách

    // Thân
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.4), clothesMat);
    body.position.y = 0.85;
    zombieGroup.add(body);

    // Đầu
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), skinMat);
    head.position.y = 1.5;
    zombieGroup.add(head);

    // Tay Zombie (Giơ về phía trước)
    const armGeo = new THREE.BoxGeometry(0.15, 0.15, 0.7);
    
    const leftArm = new THREE.Mesh(armGeo, skinMat);
    leftArm.position.set(-0.38, 1.1, -0.3);
    zombieGroup.add(leftArm);

    const rightArm = new THREE.Mesh(armGeo, skinMat);
    rightArm.position.set(0.38, 1.1, -0.3);
    zombieGroup.add(rightArm);

    // Chân
    const legGeo = new THREE.BoxGeometry(0.2, 0.7, 0.2);
    const leftLeg = new THREE.Mesh(legGeo, clothesMat);
    leftLeg.position.set(-0.15, 0.35, 0);
    zombieGroup.add(leftLeg);

    const rightLeg = new THREE.Mesh(legGeo, clothesMat);
    rightLeg.position.set(0.15, 0.35, 0);
    zombieGroup.add(rightLeg);

    return zombieGroup;
}

function spawnZombie() {
    const zombie = createZombieMesh();

    // Vị trí xuất hiện ngẫu nhiên ở xa
    const angle = Math.random() * Math.PI * 2;
    const dist = 20 + Math.random() * 25;
    zombie.position.x = Math.cos(angle) * dist;
    zombie.position.z = Math.sin(angle) * dist;

    // Tốc độ di chuyển ngẫu nhiên
    zombie.userData = {
        speed: 1.5 + Math.random() * 1.5,
        hp: 2
    };

    scene.add(zombie);
    zombies.push(zombie);
}

function setupControls() {
    instructions.addEventListener('click', () => {
        document.body.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', () => {
        if (document.pointerLockElement === document.body) {
            instructions.style.display = 'none';
        } else {
            instructions.style.display = 'flex';
        }
    });

    document.addEventListener('mousemove', (e) => {
        if (document.pointerLockElement === document.body) {
            camera.rotation.y -= e.movementX * 0.002;
            const pitch = camera.rotation.x - e.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, pitch));
        }
    });

    document.addEventListener('keydown', (e) => {
        switch (e.code) {
            case 'KeyW': moveForward = true; break;
            case 'KeyS': moveBackward = true; break;
            case 'KeyA': moveLeft = true; break;
            case 'KeyD': moveRight = true; break;
        }
    });

    document.addEventListener('keyup', (e) => {
        switch (e.code) {
            case 'KeyW': moveForward = false; break;
            case 'KeyS': moveBackward = false; break;
            case 'KeyA': moveLeft = false; break;
            case 'KeyD': moveRight = false; break;
        }
    });

    document.addEventListener('mousedown', (e) => {
        if (document.pointerLockElement === document.body && e.button === 0) {
            shoot();
        }
    });
}

function shoot() {
    if (gun) gun.position.z += 0.06; // Giật súng

    const bullet = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xffe066 })
    );

    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);

    bullet.position.copy(camera.position);
    bullet.position.add(dir.clone().multiplyScalar(0.4));
    bullet.velocity = dir.multiplyScalar(1.5);

    scene.add(bullet);
    bullets.push(bullet);
}

function animate() {
    requestAnimationFrame(animate);

    const time = performance.now();
    const delta = (time - prevTime) / 1000;
    prevTime = time;

    if (document.pointerLockElement === document.body) {
        // Di chuyển người chơi
        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

        const moveVector = new THREE.Vector3(-velocity.x * delta, 0, -velocity.z * delta);
        moveVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);
        camera.position.add(moveVector);

        camera.position.x = Math.max(-55, Math.min(55, camera.position.x));
        camera.position.z = Math.max(-55, Math.min(55, camera.position.z));

        // Hồi súng
        if (gun && gun.position.z > -0.4) {
            gun.position.z -= 0.1 * delta;
        }

        // Xử lý Đạn
        for (let i = bullets.length - 1; i >= 0; i--) {
            const b = bullets[i];
            b.position.add(b.velocity);

            let hit = false;
            for (let j = zombies.length - 1; j >= 0; j--) {
                const z = zombies[j];
                // Tính khoảng cách chạm Zombie
                if (b.position.distanceTo(z.position.clone().add(new THREE.Vector3(0, 1, 0))) < 0.9) {
                    z.userData.hp--;
                    scene.remove(b);
                    bullets.splice(i, 1);
                    hit = true;

                    if (z.userData.hp <= 0) {
                        scene.remove(z);
                        zombies.splice(j, 1);
                        score++;
                        scoreEl.innerText = score;

                        // Sinh thêm Zombie mới khát máu hơn
                        setTimeout(spawnZombie, 1000);
                        if (score % 3 === 0) spawnZombie(); // Tăng dần số lượng
                    }
                    break;
                }
            }

            if (!hit && b.position.distanceTo(camera.position) > 50) {
                scene.remove(b);
                bullets.splice(i, 1);
            }
        }

        // Zombie đuổi theo người chơi
        for (let z of zombies) {
            const dirToPlayer = new THREE.Vector3().subVectors(camera.position, z.position);
            dirToPlayer.y = 0;
            dirToPlayer.normalize();

            z.position.add(dirToPlayer.multiplyScalar(z.userData.speed * delta));
            z.lookAt(camera.position.x, z.position.y, camera.position.z); // Quay mặt về phía player

            // Tấn công Player khi chạm vào
            if (z.position.distanceTo(camera.position) < 1.2) {
                playerHp -= 0.4;
                hpEl.innerText = Math.max(0, Math.floor(playerHp));

                if (playerHp <= 0) {
                    alert('ZOMBIE ĐÃ ĂN THỊT BẠN!\nSố Zombie tiêu diệt: ' + score);
                    location.reload();
                }
            }
        }
    }

    renderer.render(scene, camera);
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

init();
animate();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Đua Xe 2D Mini</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            border: 4px solid #444;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
            background-color: #333;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 400px;
            height: 600px;
            background: rgba(0, 0, 0, 0.85);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #e74c3c;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background-color: #c0392b; }
        .instructions { margin-top: 10px; color: #aaa; font-size: 14px; }
    </style>
</head>
<body>

<h1>Game Đua Xe 2D Mini</h1>
<div id="gameContainer">
    <canvas id="roadCanvas" width="400" height="600"></canvas>
    <div id="ui">
        Điểm: <span id="score">0</span> | Tốc độ: <span id="speed">1</span>
    </div>
    <div id="gameOverScreen">
        <h2 style="color: #e74c3c; font-size: 32px;">GAME OVER</h2>
        <p>Điểm của bạn: <span id="finalScore">0</span></p>
        <button onclick="resetGame()">Chơi Lại</button>
    </div>
</div>
<div class="instructions">Dùng phím mũi tên ⬅️ ➡️ (hoặc A / D) để điều khiển xe.</div>

<script>
const canvas = document.getElementById('roadCanvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const speedEl = document.getElementById('speed');
const gameOverScreen = document.getElementById('gameOverScreen');
const finalScoreEl = document.getElementById('finalScore');

// Cấu hình đường đua
const ROAD_LEFT = 60;
const ROAD_RIGHT = 340;
const ROAD_WIDTH = ROAD_RIGHT - ROAD_LEFT;

let isGameOver = false;
let score = 0;
let gameSpeed = 4;
let lineOffsetY = 0;

// Xe người chơi
const player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 110,
    width: 40,
    height: 70,
    speed: 6,
    dx: 0
};

// Xe chướng ngại vật
let obstacles = [];

// Quản lý phím bấm
const keys = {};

window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
});

window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
});

// Vẽ mặt đường & vạch kẻ đường cuộn
function drawRoad() {
    // Thảm cỏ hai bên
    ctx.fillStyle = '#2ed573';
    ctx.fillRect(0, 0, ROAD_LEFT, canvas.height);
    ctx.fillRect(ROAD_RIGHT, 0, canvas.width - ROAD_RIGHT, canvas.height);

    // Bề mặt đường nhựa
    ctx.fillStyle = '#3f4245';
    ctx.fillRect(ROAD_LEFT, 0, ROAD_WIDTH, canvas.height);

    // Vạch kẻ đường đứt nét ở giữa
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 6;
    ctx.setLineDash([30, 20]);
    ctx.lineDashOffset = -lineOffsetY;
    
    ctx.beginPath();
    ctx.moveTo(canvas.width / 2, 0);
    ctx.lineTo(canvas.width / 2, canvas.height);
    ctx.stroke();
    
    ctx.setLineDash([]); // Reset nét đứt
}

// Vẽ xe (Người chơi & Vật cản)
function drawCar(x, y, width, height, color, isPlayer = false) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, width, height, 8);
    ctx.fill();

    // Mui xe/Kính xe
    ctx.fillStyle = '#111';
    ctx.fillRect(x + 5, isPlayer ? y + 15 : y + 35, width - 10, 20);

    // Bánh xe (4 bánh)
    ctx.fillStyle = '#000';
    ctx.fillRect(x - 4, y + 8, 4, 15);
    ctx.fillRect(x + width, y + 8, 4, 15);
    ctx.fillRect(x - 4, y + height - 23, 4, 15);
    ctx.fillRect(x + width, y + height - 23, 4, 15);

    // Đèn xe
    ctx.fillStyle = isPlayer ? '#f1c40f' : '#e74c3c';
    const lightY = isPlayer ? y : y + height - 5;
    ctx.fillRect(x + 4, lightY, 8, 5);
    ctx.fillRect(x + width - 12, lightY, 8, 5);
}

// Tạo chướng ngại vật ngẫu nhiên
function spawnObstacle() {
    if (Math.random() < 0.02) { // Tỉ lệ xuất hiện
        const width = 40;
        const height = 70;
        const x = ROAD_LEFT + Math.random() * (ROAD_WIDTH - width);
        
        // Kiểm tra không bị chèn quá sát vào xe khác
        let canSpawn = true;
        for (let obs of obstacles) {
            if (obs.y < 120) { canSpawn = false; break; }
        }

        if (canSpawn) {
            const colors = ['#e74c3c', '#9b59b6', '#3498db', '#e67e22', '#1abc9c'];
            obstacles.push({
                x: x,
                y: -height,
                width: width,
                height: height,
                color: colors[Math.floor(Math.random() * colors.length)],
                speed: Math.random() * 2 + gameSpeed - 1
            });
        }
    }
}

// Kiểm tra va chạm (AABB Collision)
function checkCollision(rect1, rect2) {
    return (
        rect1.x < rect2.x + rect2.width &&
        rect1.x + rect1.width > rect2.x &&
        rect1.y < rect2.y + rect2.height &&
        rect1.y + rect1.height > rect2.y
    );
}

// Kết thúc trò chơi
function gameOver() {
    isGameOver = true;
    finalScoreEl.innerText = score;
    gameOverScreen.style.display = 'flex';
}

// Reset trò chơi
function resetGame() {
    isGameOver = false;
    score = 0;
    gameSpeed = 4;
    obstacles = [];
    player.x = canvas.width / 2 - 20;
    scoreEl.innerText = score;
    speedEl.innerText = '1';
    gameOverScreen.style.display = 'none';
    update();
}

// Vòng lặp chính của Game
function update() {
    if (isGameOver) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Cuộn đường đua
    lineOffsetY += gameSpeed;
    if (lineOffsetY >= 50) lineOffsetY = 0;
    drawRoad();

    // 2. Điều khiển xe người chơi
    if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;

    // Giữ xe trong giới hạn đường đua
    if (player.x < ROAD_LEFT) player.x = ROAD_LEFT;
    if (player.x + player.width > ROAD_RIGHT) player.x = ROAD_RIGHT - player.width;

    drawCar(player.x, player.y, player.width, player.height, '#2ecc71', true);

    // 3. Quản lý chướng ngại vật
    spawnObstacle();

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.y += obs.speed;

        drawCar(obs.x, obs.y, obs.width, obs.height, obs.color);

        // Kiểm tra va chạm với xe người chơi
        if (checkCollision(player, obs)) {
            gameOver();
            return;
        }

        // Vượt qua chướng ngại vật thành công -> Tính điểm
        if (obs.y > canvas.height) {
            obstacles.splice(i, 1);
            score += 10;
            scoreEl.innerText = score;

            // Tăng tốc độ game dần theo điểm
            if (score % 50 === 0 && gameSpeed < 12) {
                gameSpeed += 0.5;
                speedEl.innerText = Math.floor(gameSpeed - 3);
            }
        }
    }

    requestAnimationFrame(update);
}

// Bắt đầu chạy game
update();
</script>

</body>
</html>

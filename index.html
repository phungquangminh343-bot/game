<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 목록 (Index)</title>
    <!-- FontAwesome 아이콘 라이브러리 CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #1a1a24;
            color: #ffffff;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 35px;
            font-size: 2rem;
            color: #ffffff;
            letter-spacing: -0.5px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .game-card {
            background: #252636;
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }
        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            border-color: #6c5ce7;
        }
        
        /* CSS 썸네일 박스 스타일 */
        .icon-thumbnail {
            width: 100%;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .icon-thumbnail i {
            font-size: 3.5rem;
            color: #ffffff;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
            transition: transform 0.25s ease;
        }
        .game-card:hover .icon-thumbnail i {
            transform: scale(1.15) rotate(-5deg);
        }

        /* 각 카드별 그래디언트 배경색 설정 */
        .card-1 .icon-thumbnail { background: linear-gradient(135deg, #ff7675, #d63031); }
        .card-2 .icon-thumbnail { background: linear-gradient(135deg, #74b9ff, #0984e3); }
        .card-3 .icon-thumbnail { background: linear-gradient(135deg, #55efc4, #00b894); }
        .card-4 .icon-thumbnail { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
        .card-5 .icon-thumbnail { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); }
        .card-6 .icon-thumbnail { background: linear-gradient(135deg, #ff9ff3, #f368e0); }

        .game-info {
            padding: 16px;
            text-align: center;
            font-weight: 600;
            font-size: 1.1rem;
            color: #f1f2f6;
            background: #252636;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 HTML 게임 목록</h1>
        <div class="game-grid">

            <a href="01_d.html" target="_blank" class="game-card card-1">
                <div class="icon-thumbnail">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <div class="game-info">01_d</div>
            </a>

            <a href="02_d.html" target="_blank" class="game-card card-2">
                <div class="icon-thumbnail">
                    <i class="fa-solid fa-ghost"></i>
                </div>
                <div class="game-info">02_d</div>
            </a>

            <a href="03_d.html" target="_blank" class="game-card card-3">
                <div class="icon-thumbnail">
                    <i class="fa-solid fa-rocket"></i>
                </div>
                <div class="game-info">03_d</div>
            </a>

            <a href="04_d.html" target="_blank" class="game-card card-4">
                <div class="icon-thumbnail">
                    <i class="fa-solid fa-puzzle-piece"></i>
                </div>
                <div class="game-info">04_d</div>
            </a>

            <a href="d5_d.html" target="_blank" class="game-card card-5">
                <div class="icon-thumbnail">
                    <i class="fa-solid fa-dice-five"></i>
                </div>
                <div class="game-info">d5_d</div>
            </a>

            <a href="06_d.html" target="_blank" class="game-card card-6">
                <div class="icon-thumbnail">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <div class="game-info">06_d</div>
            </a>

        </div>
    </div>

</body>
</html>

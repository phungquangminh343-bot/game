<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Bida 2D</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
        }
        h1 { margin-bottom: 10px; }
        canvas {
            border: 12px solid #5c3a21; /* Thành bàn gỗ */
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background-color: #076324; /* Mặt bàn nỉ xanh */
            cursor: crosshair;
        }
        .instructions {
            margin-top: 15px;
            color: #bbb;
            font-size: 14px;
        }
    </style>
</head>
<body>

<h1>Game Bida 2D Mini</h1>
<canvas id="poolTable" width="800" height="400"></canvas>
<div class="instructions">
    * Kéo và giữ chuột trái từ bi trắng để chỉnh hướng và lực ngắm, thả ra để bắn.
</div>

<script>
const canvas = document.getElementById('poolTable');
const ctx = canvas.getContext('2d');

const FRICTION = 0.985; // Ma sát làm chậm bóng
const BALL_RADIUS = 12;

// Định nghĩa lỗ bida (6 lỗ)
const holes = [
    { x: 15, y: 15 }, { x: canvas.width / 2, y: 10 }, { x: canvas.width - 15, y: 15 },
    { x: 15, y: canvas.height - 15 }, { x: canvas.width / 2, y: canvas.height - 10 }, { x: canvas.width - 15, y: canvas.height - 15 }
];

class Ball {
    constructor(x, y, color, isWhite = false) {
        this.x = x;
        this.y = y;
        this.vx = 0;
        this.vy = 0;
        this.color = color;
        this.isWhite = isWhite;
        this.inHole = false;
    }

    draw() {
        if (this.inHole) return;
        ctx.beginPath();
        ctx.arc(this.x, this.y, BALL_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Điểm bóng bóng cho sinh động
        ctx.beginPath();
        ctx.arc(this.x - 3, this.y - 3, 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.fill();
    }

    update() {
        if (this.inHole) return;

        // Cập nhật vị trí theo vận tốc
        this.x += this.vx;
        this.y += this.vy;

        // Áp dụng ma sát
        this.vx *= FRICTION;
        this.vy *= FRICTION;

        // Dừng bi nếu vận tốc quá nhỏ
        if (Math.hypot(this.vx, this.vy) < 0.05) {
            this.vx = 0;
            this.vy = 0;
        }

        // Bật nảy khi chạm băng (thành bàn)
        if (this.x - BALL_RADIUS < 0) { this.x = BALL_RADIUS; this.vx *= -1; }
        if (this.x + BALL_RADIUS > canvas.width) { this.x = canvas.width - BALL_RADIUS; this.vx *= -1; }
        if (this.y - BALL_RADIUS < 0) { this.y = BALL_RADIUS; this.vy *= -1; }
        if (this.y + BALL_RADIUS > canvas.height) { this.y = canvas.height - BALL_RADIUS; this.vy *= -1; }

        // Kiểm tra rơi vào lỗ
        for (let hole of holes) {
            if (Math.hypot(this.x - hole.x, this.y - hole.y) < 20) {
                this.inHole = true;
                this.vx = 0;
                this.vy = 0;
                if (this.isWhite) {
                    setTimeout(() => this.resetWhiteBall(), 500);
                }
            }
        }
    }

    resetWhiteBall() {
        this.x = 200;
        this.y = canvas.height / 2;
        this.inHole = false;
    }
}

// Khởi tạo danh sách bi
let balls = [];
const whiteBall = new Ball(200, canvas.height / 2, '#ffffff', true);
balls.push(whiteBall);

// Xếp tam giác bi mục tiêu
const startX = 550;
const startY = canvas.height / 2;
const colors = ['#f1c40f', '#2980b9', '#e74c3c', '#8e44ad', '#e67e22', '#2ecc71', '#7f8c8d', '#2c3e50', '#d35400'];
let col = 0, row = 0, colorIdx = 0;

for (let i = 0; i < 10; i++) {
    let x = startX + col * (BALL_RADIUS * 2 * 0.866);
    let y = startY + (row - col / 2) * (BALL_RADIUS * 2 + 1);
    balls.push(new Ball(x, y, colors[colorIdx % colors.length]));
    colorIdx++;
    row++;
    if (row > col) {
        col++;
        row = 0;
    }
}

// Xử lý kéo lực và ngắm bắn
let isDragging = false;
let mousePos = { x: 0, y: 0 };

canvas.addEventListener('mousedown', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    // Chỉ cho phép kéo cơ khi tất cả bóng đã dừng hẳn và click gần bi trắng
    const allStopped = balls.every(b => b.vx === 0 && b.vy === 0);
    if (allStopped && !whiteBall.inHole && Math.hypot(mx - whiteBall.x, my - whiteBall.y) < 30) {
        isDragging = true;
        mousePos = { x: mx, y: my };
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (isDragging) {
        const rect = canvas.getBoundingClientRect();
        mousePos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }
});

canvas.addEventListener('mouseup', () => {
    if (isDragging) {
        isDragging = false;
        const dx = whiteBall.x - mousePos.x;
        const dy = whiteBall.y - mousePos.y;
        
        // Đặt lực bắn dựa trên khoảng cách kéo
        const power = Math.min(Math.hypot(dx, dy) * 0.15, 25);
        const angle = Math.atan2(dy, dx);

        whiteBall.vx = Math.cos(angle) * power;
        whiteBall.vy = Math.sin(angle) * power;
    }
});

// Xử lý va chạm đàn hồi giữa các bi
function handleCollisions() {
    for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
            let b1 = balls[i];
            let b2 = balls[j];

            if (b1.inHole || b2.inHole) continue;

            let dx = b2.x - b1.x;
            let dy = b2.y - b1.y;
            let dist = Math.hypot(dx, dy);

            // Kiểm tra va chạm
            if (dist < BALL_RADIUS * 2) {
                // Tách 2 bi ra tránh bị dính nhau
                let overlap = (BALL_RADIUS * 2 - dist) / 2;
                let nx = dx / dist;
                let ny = dy / dist;

                b1.x -= nx * overlap;
                b1.y -= ny * overlap;
                b2.x += nx * overlap;
                b2.y += ny * overlap;

                // Tính toán vận tốc sau va chạm (Bảo toàn động lượng 2D)
                let kx = b1.vx - b2.vx;
                let ky = b1.vy - b2.vy;
                let p = 2 * (nx * kx + ny * ky) / 2;

                b1.vx -= p * nx;
                b1.vy -= p * ny;
                b2.vx += p * nx;
                b2.vy += p * ny;
            }
        }
    }
}

// Vòng lặp chính của Game
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Vẽ lỗ bida
    for (let hole of holes) {
        ctx.beginPath();
        ctx.arc(hole.x, hole.y, 18, 0, Math.PI * 2);
        ctx.fillStyle = '#111';
        ctx.fill();
    }

    // Cập nhật và vẽ các bi
    balls.forEach(ball => {
        ball.update();
        ball.draw();
    });

    handleCollisions();

    // Vẽ đường ngắm và gậy bida khi đang kéo chuột
    if (isDragging) {
        // Đường ngắm chấm chấm
        ctx.beginPath();
        ctx.moveTo(whiteBall.x, whiteBall.y);
        ctx.lineTo(whiteBall.x + (whiteBall.x - mousePos.x) * 2, whiteBall.y + (whiteBall.y - mousePos.y) * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // Vẽ cơ bida
        let angle = Math.atan2(mousePos.y - whiteBall.y, mousePos.x - whiteBall.x);
        let dist = Math.hypot(mousePos.x - whiteBall.x, mousePos.y - whiteBall.y);
        
        ctx.save();
        ctx.translate(whiteBall.x, whiteBall.y);
        ctx.rotate(angle);
        ctx.fillStyle = '#d35400';
        ctx.fillRect(20 + Math.min(dist * 0.2, 30), -4, 200, 8); // Thân gậy
        ctx.restore();
    }

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
